name: CI

# Runs on every pull request and on main. Nothing here deploys anything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, API tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck libraries, API and frontend
        run: pnpm run typecheck
      - name: API tests
        run: pnpm --filter @workspace/api-server test
      - name: Build
        run: pnpm run build

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any critical or high advisory in production dependencies that is not listed, with a reason and a
      # review date, in scripts/audit-allowlist.json.
      - run: node scripts/audit-gate.mjs

  gateway:
    name: Go gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache-dependency-path: backend/gateway/go.sum
      - name: Formatting
        working-directory: backend/gateway
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and tests
        working-directory: backend/gateway
        run: |
          go vet ./...
          go test ./...

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements.txt
      - run: pip install -r backend/worker/requirements.txt pytest
      - name: Tests
        working-directory: backend/worker
        run: python -m pytest tests -q

  browser:
    name: Browser tests (the server's answers are pretended)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm --filter @workspace/finverify-os exec playwright install --with-deps chromium
      # playwright.config.ts starts the Vite dev server itself.
      - name: Browser tests
        run: pnpm --filter @workspace/finverify-os exec playwright test --workers=2
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
