name: CI

# Runs on every pull request and on main. Nothing here deploys anything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, API tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck libraries, API and frontend
        run: pnpm run typecheck
      - name: API tests
        run: pnpm --filter @workspace/api-server test
      - name: Database package tests
        run: pnpm --filter @workspace/db test
      - name: Build
        run: pnpm run build
      - name: Website deployment configuration (rewrites, security headers)
        run: pnpm run test:deployment

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any critical or high advisory in production dependencies that is not listed, with a reason and a
      # review date, in scripts/audit-allowlist.json.
      - run: node scripts/audit-gate.mjs

  gateway:
    name: Go gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache-dependency-path: backend/gateway/go.sum
      - name: Formatting
        working-directory: backend/gateway
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and tests
        working-directory: backend/gateway
        run: |
          go vet ./...
          go test ./...

  gateway-database:
    name: Go gateway against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway database made for this job, never a real one. The test refuses any host but this computer.
    # The address is put together in the steps from these parts rather than written out, so that secret
    # scanners do not mistake this made-up test database for a leaked credential.
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tallythis_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallythis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the schema with the migrations (a second run must change nothing)
        shell: bash
        run: |
          export DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}"
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/db run migrate -- --check
          pnpm --filter @workspace/db run migrate
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache-dependency-path: backend/gateway/go.sum
      - name: Sign-in and permission checks against the real tables
        working-directory: backend/gateway
        shell: bash
        # A skipped check proves nothing, so a skip fails the job.
        run: |
          export GATEWAY_TEST_DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}"
          go test ./internal/routes/ -run RealDatabase -v -count=1 | tee "$RUNNER_TEMP/gateway-db.txt"
          if grep -q -- "--- SKIP" "$RUNNER_TEMP/gateway-db.txt"; then echo "A database check was skipped."; exit 1; fi

  deploy-scripts:
    name: Deployment scripts (Google Cloud VM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Lint the shell scripts
        run: shellcheck --severity=warning -x deploy/vm/*.sh
      - name: Secret-fetching tests, against a fake Google
        run: python -m pytest deploy/vm/tests -q
      - name: The compose file renders with sample settings
        run: |
          sudo mkdir -p /run/tallythis
          sudo touch /run/tallythis/api.env /run/tallythis/gateway.env /run/tallythis/worker.env
          printf '%s\n' SITE_ADDRESS=api.example.test ACME_EMAIL=ops@example.test APP_ORIGIN=https://www.example.test \
            CLOUDFLARE_R2_ACCOUNT_ID=x CLOUDFLARE_R2_BUCKET=y > "$RUNNER_TEMP/runtime.env"
          docker compose --project-directory . --env-file "$RUNNER_TEMP/runtime.env" -f deploy/vm/compose.yaml config > /dev/null

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements.txt
      - run: pip install -r backend/worker/requirements.txt pytest
      - name: Tests
        working-directory: backend/worker
        run: python -m pytest tests -q

  browser:
    name: Browser tests (the server's answers are pretended)
    # Playwright does not support the newest Ubuntu image that "ubuntu-latest" now points at, so this job is pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm --filter @workspace/finverify-os exec playwright install --with-deps chromium
      # playwright.config.ts starts the Vite dev server itself.
      - name: Browser tests
        run: pnpm --filter @workspace/finverify-os exec playwright test --workers=2
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  real-stack:
    name: Browser tests against the real backend
    # The real worker, API and gateway on a throwaway Postgres, with the website served the way Vercel serves it
    # (scripts/stack/stack.mjs). Playwright does not support the newest Ubuntu image, so this job is pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The database address is put together in the steps from these parts rather than written out, so that secret
    # scanners do not mistake this made-up test database for a leaked credential.
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tallythis_stack
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallythis_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/gateway/go.mod
          cache-dependency-path: backend/gateway/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pip install -r backend/worker/requirements.txt
      - name: Install the browser
        run: pnpm --filter @workspace/finverify-os exec playwright install --with-deps chromium
      - name: Browser tests
        shell: bash
        # Playwright starts the stack itself (it builds the API and the website first), empties the database and runs the
        # migrations. A skipped test proves nothing, so any skip fails the job.
        run: |
          export STACK_DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}"
          export STACK_FRESH=1
          pnpm --filter @workspace/finverify-os exec playwright test --config playwright.real.config.ts --reporter=list | tee "$RUNNER_TEMP/real-stack.txt"
          if grep -qE "^\s+- " "$RUNNER_TEMP/real-stack.txt"; then echo "A test was skipped."; exit 1; fi
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-stack-report
          path: frontend/test-results-real
          retention-days: 7
