# Local full-stack development using the existing Neon database from .env.
# Cloud deployment: Vercel frontend + three Railway services; see docs/DEPLOYMENT.md.
services:
  typescript-api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      PYTHON_WORKER_URL: http://python-worker:8091
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  python-worker:
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8091
      PYTHON_WORKER_PORT: 8091
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  go-api:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env
    environment:
      PORT: 8090
      GO_API_PORT: 8090
      TYPESCRIPT_API_URL: http://typescript-api:8080
      PYTHON_WORKER_URL: http://python-worker:8091
    depends_on:
      typescript-api:
        condition: service_healthy
      python-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/api/health || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      go-api:
        condition: service_healthy

volumes:
  api_uploads:
